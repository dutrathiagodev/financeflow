:root{
  --fundo:#E8ECE1; --painel:#F9FAF5; --tinta:#1F2F24; --musgo:#4D6330; --folha:#7FA653; --menta:#CFE0BC; --lima:#98CF86; --creme:#F5EFE6; --coral:#F0A58F;
  --receita:#3C6A1C; --despesa:#A63D26; --receita-suave:#DDE9CF; --despesa-suave:#F1DCD4;
  --invest:#1F5F6E; --invest-suave:#D3E4E8;
  --regua:rgba(31,47,36,.17); --regua-forte:rgba(31,47,36,.5); --muted:#556552;
  --r:10px; --lat:#1F2F24; --escuro:#1F2F24; --campo:#fff; --prim-bg:#1F2F24; --prim-fg:#F5EFE6; --menta-bg:#CFE0BC; --hover:rgba(207,224,188,.35); --now:rgba(207,224,188,.5); --barra:#4D6330; --invest-bg:#1F5F6E; --receita-bg:#3C6A1C; --despesa-bg:#A63D26; --side:232px;
  --disp:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif; --txt:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-tema="dark"]{color-scheme:dark;--fundo:#0D1410;--painel:#141D17;--campo:#0F1712;--tinta:#E4EBDD;--muted:#9BAB97;--regua:rgba(228,235,221,.13);--regua-forte:rgba(228,235,221,.34);--receita:#86C45A;--despesa:#F0876F;--receita-suave:rgba(134,196,90,.16);--despesa-suave:rgba(240,135,111,.16);--invest:#6EBBD0;--invest-suave:rgba(110,187,208,.16);--menta-bg:rgba(152,207,134,.16);--hover:rgba(152,207,134,.08);--now:rgba(152,207,134,.1);--barra:#7FA653;--prim-bg:#98CF86;--prim-fg:#0D1410;--escuro:#22372A;--lat:#09100B}
html[data-tema="light"]{color-scheme:light}
*{box-sizing:border-box;margin:0}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--regua-forte);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--regua-forte) transparent}}
.side{scrollbar-color:rgba(245,239,230,.3) transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--txt);font-size:15px;background:var(--fundo);color:var(--tinta);line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:square;stroke-linejoin:miter;flex:none}
svg.i.mini{width:15px;height:15px;vertical-align:-2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.n,.l-val,.tbl td,.tbl th,.big,.fat,.invbig{font-family:var(--disp);font-variant-numeric:tabular-nums lining-nums}

/* estrutura */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{background:var(--lat);color:var(--creme);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px 12px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px;--bars:#F5EFE6;--arrow:#98CF86}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--disp);font-size:1.3rem;font-weight:700;letter-spacing:-.025em;line-height:1;display:block}
.brand b i{font-style:normal;color:var(--lima)}
.brand small{display:block;font-size:.5rem;font-weight:600;letter-spacing:.3em;color:var(--menta);margin-top:5px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:rgba(245,239,230,.72);padding:0 12px;border-radius:var(--r);font-weight:500;font-size:.95rem;text-align:left;min-height:44px}
.nav button:hover{background:rgba(245,239,230,.07);color:var(--creme)}
.nav button[aria-current="page"]{background:var(--creme);color:#1F2F24;font-weight:700}
.side-foot{margin-top:auto;display:grid;gap:10px;padding-top:16px;border-top:1px solid rgba(245,239,230,.18)}
.side-foot small{color:var(--menta);font-size:.8rem;padding:0 4px}
.link{background:none;border:0;color:var(--menta);font-size:.8rem;text-align:left;padding:4px;text-decoration:underline;text-underline-offset:3px}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--fundo);border-bottom:1px solid var(--regua-forte);padding:20px 32px 16px;display:flex;align-items:flex-end;gap:16px;position:sticky;top:0;z-index:20}
.top h1{font-family:var(--disp);font-size:1.9rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.top p{color:var(--muted);font-size:.9rem;margin-top:2px}
.top .grow{flex:1;min-width:0}
.top .brandm{display:none}
.actions{display:flex;gap:8px;align-items:center;position:relative}
.view{padding:24px 32px 56px;max-width:1360px;width:100%}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--tinta);background:transparent;color:var(--tinta);border-radius:var(--r);padding:0 16px;min-height:44px;font-weight:600;font-size:.92rem;white-space:nowrap}
.btn:hover{background:rgba(31,47,36,.08)}
.btn.primary{background:var(--prim-bg);color:var(--prim-fg);border-color:var(--prim-bg)}
.btn.primary:hover{background:var(--musgo);border-color:var(--musgo);color:var(--creme)}
.btn.light{border-color:rgba(245,239,230,.4);color:var(--creme)}
.btn.light:hover{background:rgba(245,239,230,.1)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.85rem}
.btn.block{width:100%}
.btn.inv{background:var(--invest-bg);border-color:var(--invest-bg);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:var(--r);border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{background:var(--despesa-suave);color:var(--despesa)}
.menu{position:absolute;right:0;top:52px;background:var(--painel);border:1px solid var(--regua-forte);border-radius:var(--r);padding:4px;min-width:300px;z-index:40;box-shadow:0 10px 30px rgba(31,47,36,.2)}
.menu button{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:11px 12px;border-radius:7px}
.menu button:hover{background:var(--menta-bg)}
.menu strong{display:block;font-size:.92rem}
.menu small{color:var(--muted);font-size:.8rem;line-height:1.35}
.menu[hidden]{display:none}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px}
.fld input,.fld select{width:100%;background:var(--campo);border:1px solid var(--regua-forte);border-radius:var(--r);padding:0 12px;min-height:44px;font-size:.95rem}
.fld input:focus,.fld select:focus{outline:2px solid var(--tinta);outline-offset:0;border-color:var(--tinta)}
.fld.bad input,.fld.bad select{border-color:var(--despesa);box-shadow:inset 0 0 0 1px var(--despesa)}
.err{display:block;color:var(--despesa);font-size:.82rem;margin-top:4px;font-style:normal;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--regua-forte);border-radius:var(--r);margin-bottom:16px;overflow:hidden;background:var(--campo)}
.seg.s3{grid-template-columns:repeat(3,1fr);margin:0}
.seg label{position:relative}
.seg label+label{border-left:1px solid var(--regua-forte)}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:grid;place-items:center;min-height:42px;font-weight:600;font-size:.9rem;color:var(--muted);text-align:center;padding:0 8px}
.seg input:checked+span{color:var(--prim-fg);background:var(--prim-bg)}
.seg input[value="despesa"]:checked+span{background:var(--despesa-bg);color:#fff}
.seg input[value="receita"]:checked+span,.seg input[value="aporte"]:checked+span{background:var(--receita-bg);color:#fff}
.seg input[value="resgate"]:checked+span{background:var(--invest-bg);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--tinta);outline-offset:-4px}
.mov-form:not([data-cartao]) .pay{grid-template-columns:1fr}
.mov-form[data-tipo="receita"] .pay,.mov-form:not([data-cartao]) .parc{display:none}

/* painéis (sem sombra, sem card dentro de card) */
.card{background:var(--painel);border:1px solid var(--regua-forte);border-radius:var(--r);padding:18px 20px}
.card>h2{font-family:var(--disp);font-size:1.02rem;font-weight:700;letter-spacing:-.01em;margin:-18px -20px 18px;padding:12px 20px;border-bottom:1px solid var(--regua);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.card>h2 small{font-family:var(--txt);font-weight:500;color:var(--muted);font-size:.85rem}
.muted{color:var(--muted)}
.pad-b{margin-bottom:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted)}

/* demonstrativo: o formato de livro-caixa */
.dem{display:grid}
.dem .ln{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid var(--regua)}
.dem .ln span:first-child{color:var(--muted)}
.dem .ln b{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums lining-nums}
.dem .ln.sub{border-bottom:0;padding-top:0;margin-top:-3px}
.dem .ln.sub span{font-size:.82rem}
.dem .ln.tot{border-top:1px solid var(--tinta);border-bottom:0;padding-top:11px}
.dem .ln.tot span:first-child{color:var(--tinta);font-weight:700}
.dem .ln.fim{border-top:4px double var(--tinta);border-bottom:0;padding-top:11px}
.dem .ln.fim span:first-child{color:var(--tinta);font-weight:700}
.dem .ln.fim b{font-size:1.3rem;font-weight:800}
.rv{color:var(--receita)} .dv{color:var(--despesa)} .iv{color:var(--invest)}
.hero{background:var(--escuro);color:var(--creme);border-radius:var(--r);padding:28px 30px 24px;display:grid;align-content:start}
.hero .lab{color:var(--menta);font-size:.9rem;font-weight:500}
.big{font-size:clamp(2.7rem,5vw,4.3rem);font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 20px}
.hero .dem .ln{border-color:rgba(245,239,230,.2)}
.hero .dem .ln span:first-child{color:var(--menta)}
.hero .rv{color:var(--lima)} .hero .dv{color:var(--coral)} .hero .iv{color:#8FD0E0}
.hero .bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:18px 0 8px;background:rgba(245,239,230,.16)}
.hero .bar i{display:block;height:100%;background:var(--coral)}
.hero .cap{font-size:.85rem;color:var(--menta)}
.strip{display:grid;grid-template-columns:1.5fr 1fr 1fr;border:1px solid var(--regua-forte);border-radius:var(--r);margin-bottom:16px;background:var(--painel);overflow:hidden}
.strip .cell{padding:16px 22px}
.strip .cell+.cell{border-left:1px solid var(--regua-forte)}
.strip .cell.dark{background:var(--escuro);color:var(--creme)}
.strip small{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
.strip .dark small{color:var(--menta)}
.strip b{display:block;font-family:var(--disp);font-size:1.7rem;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums lining-nums}
.strip .dark b{font-size:2.5rem;font-weight:800;letter-spacing:-.035em}
.strip em{display:block;font-style:normal;font-size:.82rem;color:var(--muted)}
.strip .dark em{color:var(--menta)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:stretch}
.two-col{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.lanc{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.lanc>.card:first-child{position:sticky;top:104px}
.mnav{display:flex;align-items:center;gap:6px;font-weight:700}
.mnav button{width:40px;height:40px;border-radius:var(--r);border:1px solid var(--regua-forte);background:transparent;display:grid;place-items:center}
.mnav button:hover{background:var(--menta-bg)}
.mnav span{min-width:140px;text-align:center;font-family:var(--disp);font-size:1.05rem}

/* lista de lançamentos */
.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:center;margin-bottom:14px}
.filters .seg{grid-column:1/-1;margin-bottom:0}
.filters .fld{margin:0}
.filters .fld select{min-height:42px}
.count{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.85rem;margin:2px 0 6px;flex-wrap:wrap}
.lhead,.lrow{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr) 88px minmax(0,1fr) minmax(0,1.1fr) 44px;gap:12px;align-items:center}
.lhead{padding:8px 4px;color:var(--muted);font-size:.82rem;font-weight:600;border-bottom:2px solid var(--tinta)}
.lhead .r,.lrow .l-val{text-align:right}
.lrow{padding:9px 4px;border-bottom:1px solid var(--regua);font-size:.93rem}
.lrow:hover{background:var(--hover)}
.l-desc{display:flex;align-items:center;gap:12px;min-width:0}
.l-desc strong{font-weight:600;overflow-wrap:anywhere}
.mk{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.lrow.receita .mk{background:var(--receita)} .lrow.despesa .mk{background:var(--despesa)}
.lrow.aporte .mk,.lrow.resgate .mk{background:var(--invest)}
.lrow.receita .l-val{color:var(--receita)} .lrow.despesa .l-val{color:var(--despesa)}
.lrow.aporte .l-val,.lrow.resgate .l-val{color:var(--invest)}
.l-val{font-weight:600;white-space:nowrap;font-size:.98rem}
.l-meta{display:none;color:var(--muted);font-size:.84rem}
.l-cat,.l-date,.l-pay{color:var(--muted);font-size:.9rem}
.chip{display:inline-block;border:1px solid var(--regua-forte);color:var(--tinta);font-size:.72rem;font-weight:600;border-radius:5px;padding:0 6px;margin-left:8px;white-space:nowrap;line-height:1.5}
.chip.g{border-color:#8A6D12;color:#6E560C;background:#F3E6B8}
.chip.i{border-color:var(--invest);color:var(--invest)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--tinta);font-size:1.02rem;margin-bottom:4px}
.empty svg.sym{width:48px;height:48px;opacity:.3;margin:0 auto 10px;display:block}

/* planilha */
.tw{overflow-x:auto;border:1px solid var(--regua-forte);border-radius:var(--r)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem;min-width:1000px;background:var(--campo)}
.tbl th{padding:10px 8px;text-align:right;font-weight:700;font-size:.82rem;background:var(--painel);border-bottom:2px solid var(--tinta);position:sticky;top:0}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:inherit;z-index:2;white-space:nowrap;min-width:200px;font-family:var(--txt)}
.tbl td:first-child{background:var(--campo)}
.tbl td{padding:8px;text-align:right;border-bottom:1px solid var(--regua)}
.tbl td i{color:var(--muted);font-style:normal;opacity:.5}
.tbl .now{background:var(--now)}
.tbl th.now{background:var(--menta-bg)}
.tbl .tt{font-weight:700;border-left:1px solid var(--regua-forte)}
.tbl tr.sec td{background:var(--fundo);font-weight:700;color:var(--tinta);text-align:left;padding:8px 14px;font-family:var(--txt);font-size:.82rem}
.tbl tr.r td:not(:first-child){color:var(--receita)}
.tbl tr.d td:not(:first-child){color:var(--despesa)}
.tbl tr.tot td{font-weight:700;border-top:1px solid var(--tinta)}
.tbl tr.ant td{color:var(--muted)}
.tbl tr.sobra td{background:var(--escuro);color:var(--creme);font-weight:700;border-bottom:0}
.tbl tr.sobra td:first-child{background:var(--escuro)}
.tbl tr.sobra td i{color:var(--menta)}
.tbl tr.sobra td.neg{color:var(--coral)}
.tbl tr.fim td{font-weight:700;border-top:4px double var(--tinta)}
.tbl tr.inv td{color:var(--invest);font-weight:600}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:12px}

/* cartões */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;margin-bottom:16px}
.cc{--corpo:#101712;border:1px solid rgba(245,239,230,.12);background:var(--corpo);color:var(--creme);border-radius:calc(var(--r) + 6px);padding:8px 8px 0;border-bottom:6px solid var(--c1);display:grid;gap:0;position:relative;overflow:hidden}
.cc-top{position:relative;background:linear-gradient(120deg,var(--c1),var(--c2));border-radius:calc(var(--r) + 2px);min-height:132px;padding:14px 16px 0;color:#fff;display:grid}
.cc-top::after{content:"";position:absolute;left:0;bottom:0;width:56%;height:62px;background:var(--corpo);border-top-right-radius:26px}
.cc-chip{width:22px;height:22px;stroke-width:1.6;opacity:.95}
.cc .fat{position:absolute;right:16px;top:12px;font-size:1.85rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;text-align:right}
.cc-nome{position:absolute;left:12px;bottom:6px;z-index:1;display:grid;line-height:1.25}
.cc-nome b{font-family:var(--disp);font-size:1.12rem;font-weight:700;color:#fff}
.cc-nome span{font-size:.82rem;color:rgba(245,239,230,.7)}
.cc-body{padding:14px 10px 14px;display:grid;gap:9px}
.cc .tr{height:6px;background:rgba(245,239,230,.16);border-radius:99px;overflow:hidden}
.cc .tr i{display:block;height:100%;background:var(--c2);border-radius:99px;min-width:3px} .cc .tr i.h{background:var(--coral)}
.cc .m{display:flex;justify-content:space-between;font-size:.85rem;color:rgba(245,239,230,.7);gap:8px;flex-wrap:wrap}
.cc .m b{color:#fff;font-family:var(--disp);font-weight:600}
.cc .link{padding:0;color:rgba(245,239,230,.6);justify-self:start}
.cc.mini .cc-top{min-height:112px}
.cc.mini .cc-top::after{height:54px}
.cc.mini .fat{font-size:1.5rem}
.cc.mini .cc-body{padding:12px 10px}

/* investimentos */
.invbig{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1.1;color:var(--invest)}
.split{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin:14px 0 10px}
.split i:nth-child(1){background:var(--invest)} .split i:nth-child(2){background:#6FA7B5} .split i:nth-child(3){background:#B5D3DB} .split i{flex-basis:0}
.leg{display:grid;gap:5px;font-size:.9rem}
.leg s{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;text-decoration:none}
.leg span:nth-child(1) s{background:var(--invest)} .leg span:nth-child(2) s{background:#6FA7B5} .leg span:nth-child(3) s{background:#B5D3DB}
.meta{border-top:1px solid var(--regua-forte);margin-top:18px;padding-top:16px}
.meta .tr{height:8px;border-radius:99px;overflow:hidden;background:var(--invest-suave);margin:10px 0 8px}
.meta .tr i{display:block;height:100%;background:var(--invest)}
.meta small{color:var(--invest);font-weight:600}
.lrow.inv-row,.lhead.inv-row{grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) 88px minmax(0,1.1fr) 44px}


.card>h2 .mact{display:flex;align-items:center;gap:12px;font-family:var(--txt);font-weight:500;color:var(--muted);font-size:.85rem}
.mstrip{display:grid;grid-template-columns:repeat(6,1fr)}
.mcell{padding:2px 14px 2px 0}
.mcell+.mcell{border-left:1px solid var(--regua);padding-left:16px}
.mcell small{display:block;color:var(--muted);font-size:.85rem}
.mcell b{display:block;font-family:var(--disp);font-size:1.45rem;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums lining-nums;line-height:1.25}
.mcell em{font-style:normal;font-size:.8rem;color:var(--muted)}
.mnote{margin-top:12px}
.lhead.rend,.lrow.rend{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.5fr)}
.lrow.rend .r{text-align:right}
.lrow.rend.tot{border-top:2px solid var(--tinta);border-bottom:0;font-weight:700}
.lrow.rend.tot:hover{background:none}
@media(max-width:1240px){.mstrip{grid-template-columns:repeat(3,1fr)}.mcell:nth-child(4){border-left:0;padding-left:0}.mcell:nth-child(n+4){border-top:1px solid var(--regua);margin-top:12px;padding-top:12px}}
@media(max-width:1023px){.lhead.rend{display:grid;font-size:.72rem}.lhead.rend,.lrow.rend{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:6px;grid-template-areas:none}.lrow.rend{padding:10px 0;font-size:.82rem}.lrow.rend .l-val{font-size:.82rem;white-space:normal;grid-area:auto}.lrow.rend .chip{display:block;margin:2px 0 0;width:fit-content}.lrow.rend .l-desc{grid-area:auto}.mstrip{grid-template-columns:1fr 1fr}.mcell:nth-child(n){border-left:0;padding-left:0}.mcell:nth-child(even){border-left:1px solid var(--regua);padding-left:14px}.mcell:nth-child(n+3){border-top:1px solid var(--regua);margin-top:12px;padding-top:12px}.card>h2 .mact{font-size:.8rem}}

/* gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--txt);font-size:11px;fill:#556552}
.lg{display:flex;gap:16px;font-size:.85rem;color:var(--muted);font-family:var(--txt);font-weight:500}
.lg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.catrow{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;font-size:.9rem;padding:8px 0;border-bottom:1px solid var(--regua)}
.catrow .tr{height:8px;border-radius:99px;overflow:hidden;background:var(--menta-bg)}
.catrow .tr i{display:block;height:100%;background:var(--barra);border-radius:99px}
.catrow b{font-family:var(--disp);font-weight:600}


.tabs{display:inline-flex;border:1px solid var(--regua-forte);border-radius:var(--r);overflow:hidden;font-family:var(--txt)}
.tabs button{background:transparent;border:0;padding:0 12px;min-height:34px;font-size:.82rem;font-weight:600;color:var(--muted)}
.tabs button+button{border-left:1px solid var(--regua-forte)}
.tabs .st{display:none}
@media(max-width:1023px){.tabs .lt{display:none}.tabs .st{display:inline}.tabs button{padding:0 11px}.card>h2{flex-wrap:wrap}}
.tabs button[aria-pressed="true"]{background:var(--prim-bg);color:var(--prim-fg)}
.lcw{position:relative;touch-action:pan-y}
.lcw svg{width:100%;height:auto;display:block;overflow:visible}
.lcw text{font-family:var(--txt);font-size:11px;fill:var(--muted)}
.lcw text.cur{fill:var(--tinta);font-weight:700}
.lcw .gh{stroke:var(--regua);stroke-width:1}
.lcw .gv{stroke:var(--regua);stroke-width:1;stroke-dasharray:3 4}
.lcw .ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lcw .end{fill:var(--painel);stroke-width:2.4}
.lcw .hv{stroke:var(--tinta);stroke-width:1;opacity:.5}
.lcw .hd{stroke:var(--painel);stroke-width:2}
.tip{position:absolute;top:6px;z-index:5;background:var(--escuro);color:var(--creme);padding:9px 12px;border-radius:8px;font-size:.82rem;display:grid;gap:3px;pointer-events:none;min-width:150px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.tip[hidden]{display:none}
.tip b{font-family:var(--disp);font-size:.9rem}
.tip span{display:flex;align-items:center;gap:7px;color:rgba(245,239,230,.78)}
.tip span strong{margin-left:auto;padding-left:12px;color:#fff;font-family:var(--disp);font-variant-numeric:tabular-nums}
.tip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart .lg{margin:0 0 4px}
.dem.per{margin-top:14px}
.pad-s{margin-bottom:6px}

/* modal, toast, nav mobile */
.modal{position:fixed;inset:0;background:rgba(31,47,36,.6);z-index:60;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.sheet{background:var(--painel);border:1px solid var(--regua-forte);border-radius:var(--r);width:min(460px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px}
.sheet h2{font-family:var(--disp);font-size:1.2rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sheet .x{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--regua-forte);background:transparent;display:grid;place-items:center}
.sheet .choices{display:grid;gap:10px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--escuro);color:var(--creme);padding:10px 12px 10px 18px;border-radius:var(--r);display:flex;align-items:center;gap:16px;box-shadow:0 12px 32px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--lima);font-weight:700;padding:6px 4px;min-height:36px}
.bnav,.fab{display:none}

@media(max-width:1240px){.lanc{grid-template-columns:310px minmax(0,1fr)}.lhead,.lrow{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) 84px minmax(0,1.1fr) 44px}.l-pay,.lhead .l-pay{display:none}.pgrid,.two-col{grid-template-columns:1fr}}
@media(max-width:1023px){
  .app{display:block}
  .side{display:none}
  .top{padding:12px 16px;align-items:center;position:sticky}
  .top .brandm{display:flex;--bars:var(--tinta);--arrow:var(--barra);align-items:center;gap:8px}
  .top .brandm svg{width:28px;height:28px}
  .top .brandm b{font-family:var(--disp);font-size:1.1rem;font-weight:700;letter-spacing:-.025em}
  .top .brandm b i{font-style:normal;color:var(--barra)}
  .top .tit{display:none}
  .top .grow:not(.tit){display:block!important;flex:1}
  .actions .btn span.t{display:none}
  .actions .btn.primary{display:none}
  .view{padding:16px 16px 150px}
  .view::before{content:attr(data-t);display:block;font-family:var(--disp);font-size:1.6rem;font-weight:700;letter-spacing:-.03em;margin-bottom:14px}
  .lanc{grid-template-columns:1fr}
  .lanc>.card:first-child{position:static;display:none}
  .strip{grid-template-columns:1fr 1fr}
  .strip .cell.dark{grid-column:1/-1}
  .strip .cell+.cell{border-left:0;border-top:1px solid var(--regua-forte)}
  .strip .cell:nth-child(3){border-left:1px solid var(--regua-forte)}
  .lhead{display:none}
  .lrow{grid-template-columns:minmax(0,1fr) auto 44px;grid-template-areas:"d v x" "m m m";row-gap:0;padding:11px 0}
  .lrow .l-desc{grid-area:d}.lrow .l-val{grid-area:v}.lrow .del{grid-area:x}.lrow .l-meta{grid-area:m;display:block;padding-left:20px;margin-top:-8px}
  .l-cat,.l-date,.l-pay{display:none}
  .lrow.inv-row{grid-template-columns:minmax(0,1fr) auto 44px}
  .filters{grid-template-columns:1fr 1fr}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--painel);border-top:1px solid var(--regua-forte);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);min-height:52px;border-radius:var(--r)}
  .bnav button[aria-current="page"]{background:var(--prim-bg);color:var(--prim-fg)}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:31;background:var(--prim-bg);color:var(--prim-fg);border:0;border-radius:var(--r);height:52px;padding:0 20px;align-items:center;gap:8px;font-weight:700;box-shadow:0 8px 22px rgba(31,47,36,.35)}
  .toast{bottom:150px}
  .modal{align-items:end;padding:0}
  .sheet{border-radius:var(--r) var(--r) 0 0;width:100%;max-height:92vh}
  .catrow{grid-template-columns:100px 1fr auto}
  .menu{position:fixed;left:12px;right:12px;top:64px;min-width:0}
  .big{font-size:3rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.iconbtn.tema{border:1px solid var(--regua-forte);color:var(--tinta)}
.iconbtn.tema:hover{background:var(--hover);color:var(--tinta)}
.tema .sol{display:none}
html[data-tema="dark"] .tema .sol{display:block}
html[data-tema="dark"] .tema .lua{display:none}
body:not([data-page="planilha"]) #btnExp,body:not([data-page="planilha"]) #menuExp{display:none!important}
body:not([data-page="lancamentos"]) .actions .btn.primary[data-act="novo"],body:not([data-page="lancamentos"]) .fab{display:none!important}
</style>

<script>
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const M3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const num2=v=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
const r2=v=>Math.round(v*100)/100;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const HOJE=iso(new Date());
const fd=s=>`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zero=v=>Math.abs(v)<.005;
function addMonths(s,n){const y=+s.slice(0,4),m=+s.slice(5,7)-1,d=+s.slice(8,10);const t=new Date(y,m+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return iso(new Date(t.getFullYear(),t.getMonth(),Math.min(d,last)))}
function diaNoMes(y,m,d){const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,last))}

const CATS={receita:['Salário','Freelance','Mesada','Outros'],despesa:['Alimentação','Transporte','Moradia','Educação','Lazer','Saúde','Doações','Outros']};
const ic=(n,c)=>`<svg class="i${c?' '+c:''}" aria-hidden="true"><use href="#l-${n}"/></svg>`;
const EMO={'Salário':'wallet','Freelance':'laptop','Mesada':'banknote','Alimentação':'utensils','Transporte':'bus','Moradia':'house','Educação':'graduation-cap','Lazer':'clapperboard','Saúde':'pill','Doações':'heart-handshake','Outros':'package'};
const INVCATS=['Reserva de emergência','Renda fixa','Renda variável','Fundos','Outros'];

/* ================= dados ================= */
const KEY='financeflow:plataforma:v1';
function seed(){
  const m=(d,v,t,c,data,cartaoId)=>({id:uid(),descricao:d,valor:v,tipo:t,categoria:c,data,cartaoId:cartaoId||null,parcela:null});
  return{
    mov:[
      m('Cinema',42,'despesa','Lazer','2026-11-15','c-inter'),m('Livros técnicos',129.8,'despesa','Educação','2026-11-12','c-nubank'),
      m('Freela de site',450,'receita','Freelance','2026-11-11'),m('Fone de ouvido',100,'despesa','Lazer','2026-11-10','c-nubank'),
      m('Streaming',39.9,'despesa','Lazer','2026-11-08','c-inter'),m('Mercado do mês',187.4,'despesa','Alimentação','2026-10-14'),
      m('Farmácia',76.1,'despesa','Saúde','2026-10-05'),m('Venda de livros usados',400,'receita','Outros','2026-10-02'),
      m('Almoço no refeitório',48.1,'despesa','Alimentação','2026-09-09'),m('Internet',99.9,'despesa','Moradia','2026-09-07'),
      m('Recarga do ônibus',60,'despesa','Transporte','2026-09-04'),m('Mesada',500,'receita','Mesada','2026-09-01')],
    cartoes:[{id:'c-nubank',nome:'Nubank',cor:'roxo',limite:2500,fechamentoDia:20,vencimentoDia:27},{id:'c-inter',nome:'Inter',cor:'laranja',limite:1200,fechamentoDia:5,vencimentoDia:12}],
    inv:[
      {id:uid(),nome:'Tesouro Selic',categoria:'Reserva de emergência',operacao:'aporte',valor:200,data:'2026-11-12',idx:'selic',pct:100},
      {id:uid(),nome:'CDB 100% CDI',categoria:'Renda fixa',operacao:'aporte',valor:150,data:'2026-11-05',idx:'cdi',pct:100},
      {id:uid(),nome:'Tesouro Selic',categoria:'Reserva de emergência',operacao:'resgate',valor:80,data:'2026-11-03',idx:'selic',pct:100},
      {id:uid(),nome:'Tesouro Selic',categoria:'Reserva de emergência',operacao:'aporte',valor:300,data:'2026-10-10',idx:'selic',pct:100},
      {id:uid(),nome:'CDB 100% CDI',categoria:'Renda fixa',operacao:'aporte',valor:150,data:'2026-10-07',idx:'cdi',pct:100},
      {id:uid(),nome:'Tesouro Selic',categoria:'Reserva de emergência',operacao:'aporte',valor:300,data:'2026-09-08',idx:'selic',pct:100}],
    meta:{categoria:'Reserva de emergência',valor:3000}};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.mov&&o.cartoes&&o.inv){o.inv.forEach(i=>{if(!('idx' in i)){const n=i.nome.toLowerCase();i.idx=n.includes('selic')?'selic':(n.includes('cdb')||n.includes('cdi')||n.includes('lci')||n.includes('lca'))?'cdi':null;i.pct=100}});return o}}}catch(e){}return null}
let S=load()||seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const ui={janela:6,page:'lancamentos',mes:HOJE.slice(0,7),ano:+HOJE.slice(0,4),F:{tipo:'todas',cat:'',pag:'',mes:''},cartaoSel:'',invForm:false};
(function(){const h=location.hash.slice(1);if(['painel','lancamentos','planilha','cartoes','investimentos'].includes(h))ui.page=h;
  // se o mês atual não tem dados, abre no último mês com dados
  if(S.mov.length&&!S.mov.some(m=>m.data.slice(0,7)===ui.mes)){const u=S.mov.map(m=>m.data).sort().pop();ui.mes=u.slice(0,7);ui.ano=+u.slice(0,4)}})();

/* ================= cálculos ================= */
const efetiva=m=>m.data<=HOJE;
function totais(){let R=0,D=0,C=0;S.mov.forEach(m=>{if(!efetiva(m))return;if(m.tipo==='receita')R+=m.valor;else{D+=m.valor;if(m.cartaoId)C+=m.valor}});return{R:r2(R),D:r2(D),saldo:r2(R-D),cartao:r2(C)}}
function invSinal(i){return i.operacao==='aporte'?i.valor:-i.valor}
function invTotal(){return r2(S.inv.reduce((a,i)=>a+invSinal(i),0))}
function invPorCat(){const o={};S.inv.forEach(i=>{o[i.categoria]=(o[i.categoria]||0)+invSinal(i)});return Object.entries(o).map(([k,v])=>[k,r2(v)]).filter(([k,v])=>!zero(v)).sort((a,b)=>b[1]-a[1])}
function agregarAno(ano){
  const meses=Array.from({length:12},()=>({r:0,d:0,c:{},inv:0}));
  let prior=0;
  S.mov.forEach(m=>{const y=+m.data.slice(0,4);const sg=m.tipo==='receita'?m.valor:-m.valor;
    if(y<ano)prior+=sg;
    if(y===ano){const x=meses[+m.data.slice(5,7)-1];x[m.tipo==='receita'?'r':'d']+=m.valor;const k=(m.tipo==='receita'?'r|':'d|')+m.categoria;x.c[k]=(x.c[k]||0)+m.valor}});
  S.inv.forEach(i=>{if(+i.data.slice(0,4)===ano)meses[+i.data.slice(5,7)-1].inv+=invSinal(i)});
  let acc=r2(prior);meses.forEach(x=>{x.ant=acc;x.sobra=r2(x.r-x.d);acc=r2(acc+x.sobra);x.fim=acc;x.tem=(x.r+x.d)>0});
  return{meses,prior:r2(prior)};
}
function calcularCiclo(c){
  const [y,mo,d]=HOJE.split('-').map(Number);const ref=new Date(y,mo-1,d);
  let fech=diaNoMes(y,mo-1,c.fechamentoDia);
  const ultimo=fech<=ref?fech:diaNoMes(y,mo-2,c.fechamentoDia);
  const prox=diaNoMes(ultimo.getFullYear(),ultimo.getMonth()+1,c.fechamentoDia);
  let venc=diaNoMes(prox.getFullYear(),prox.getMonth(),c.vencimentoDia);
  if(venc<=prox)venc=diaNoMes(prox.getFullYear(),prox.getMonth()+1,c.vencimentoDia);
  const a=iso(ultimo),b=iso(prox);
  const fatura=r2(S.mov.filter(m=>m.cartaoId===c.id&&m.data>a&&m.data<=b).reduce((s,m)=>s+m.valor,0));
  return{fatura,disponivel:r2(c.limite-fatura),uso:Math.min(100,fatura/c.limite*100),vence:iso(venc)};
}
const cartaoNome=id=>{const c=S.cartoes.find(x=>x.id===id);return c?c.nome:'Cartão removido'};

/* ================= páginas ================= */

/* ================= gráficos de linha ================= */
const CH={};
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const tick=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v));
function curva(P){
  const n=P.length;if(n===1)return `M${P[0][0]},${P[0][1]}`;
  const dx=[],m=[],t=[];for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];m[i]=(P[i+1][1]-P[i][1])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=0;t[i+1]=0}else{const a=t[i]/m[i],b=t[i+1]/m[i],q=a*a+b*b;if(q>9){const k=3/Math.sqrt(q);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}}
  let d=`M${P[0][0]},${P[0][1]}`;for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=` C${P[i][0]+h},${P[i][1]+t[i]*h} ${P[i+1][0]-h},${P[i+1][1]-t[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`}
  return d;
}
function janelaMeses(){
  const [y,m]=ui.mes.split('-').map(Number);const out=[],cache={};
  for(let k=ui.janela-1;k>=0;k--){let yy=y,mm=m-k;while(mm<1){mm+=12;yy--}const P=cache[yy]||(cache[yy]=agregarAno(yy));out.push({y:yy,m:mm,...P.meses[mm-1]})}
  return out;
}
function lineChart(id,J,series,W0){
  const W=W0||720,H=W0?230:250,L=56,R=22,T=16,B=30,n=J.length;
  const max=niceMax(Math.max(0,...series.flatMap(x=>x.vals)));
  const X=i=>n===1?L+(W-L-R)/2:L+(W-L-R)*i/(n-1),Y=v=>T+(H-T-B)*(1-v/max);
  CH[id]={J,series,W,H,X:Array.from({length:n},(_,i)=>X(i)),Y};
  let g='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs>'+series.map((x,k)=>`<linearGradient id="g-${id}-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${x.cor};stop-opacity:.34"/><stop offset="1" style="stop-color:${x.cor};stop-opacity:0"/></linearGradient>`).join('')+'</defs>';
  for(let k=0;k<=4;k++){const y=T+(H-T-B)*(1-k/4);g+=`<line class="gh" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-10}" y="${y+4}" text-anchor="end">${tick(max*k/4)}</text>`}
  J.forEach((x,i)=>{g+=`<line class="gv" x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${H-B}"/><text x="${X(i)}" y="${H-8}" text-anchor="middle" ${i===n-1?'class="cur"':''}>${M3[x.m-1]}</text>`});
  series.forEach((x,k)=>{const P=x.vals.map((v,i)=>[X(i),Y(v)]);const d=curva(P);
    if(n>1)g+=`<path d="${d} L${X(n-1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="url(#g-${id}-${k})"/>`;
    g+=`<path d="${d}" class="ln" style="stroke:${x.cor}"/><circle cx="${P[n-1][0]}" cy="${P[n-1][1]}" r="5" class="end" style="stroke:${x.cor}"/>`});
  g+=`<line class="hv" id="hv-${id}" y1="${T}" y2="${H-B}" visibility="hidden"/>`+series.map((x,k)=>`<circle class="hd" id="hd-${id}-${k}" r="4.5" visibility="hidden" style="fill:${x.cor}"/>`).join('')+'</svg>';
  const tb=`<table class="sr"><caption>${series.map(x=>x.nome).join(' e ')} por mês</caption><tr><th>Mês</th>${series.map(x=>`<th>${x.nome}</th>`).join('')}</tr>${J.map((x,i)=>`<tr><td>${MES[x.m-1]} de ${x.y}</td>${series.map(z=>`<td>${brl(z.vals[i])}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<div class="lcw" data-ch="${id}">${g}<div class="tip" hidden></div>${tb}</div>`;
}
function showTip(w,cx){
  const c=CH[w.dataset.ch];if(!c)return;const svg=w.querySelector('svg'),r=svg.getBoundingClientRect();const x=(cx-r.left)/r.width*c.W;
  let k=0,best=1e9;c.X.forEach((v,i)=>{const dd=Math.abs(v-x);if(dd<best){best=dd;k=i}});
  const id=w.dataset.ch,hv=$('#hv-'+id,w);hv.setAttribute('x1',c.X[k]);hv.setAttribute('x2',c.X[k]);hv.setAttribute('visibility','visible');
  c.series.forEach((s_,j)=>{const d=$('#hd-'+id+'-'+j,w);d.setAttribute('cx',c.X[k]);d.setAttribute('cy',c.Y(s_.vals[k]));d.setAttribute('visibility','visible')});
  const tip=$('.tip',w);const J=c.J[k];tip.innerHTML=`<b>${MES[J.m-1]} de ${J.y}</b>${c.series.map(s_=>`<span><i style="background:${s_.cor}"></i>${s_.nome}<strong>${brl(s_.vals[k])}</strong></span>`).join('')}`;tip.hidden=false;
  const pct=c.X[k]/c.W*100;tip.style.left=pct+'%';tip.style.transform=pct>70?'translateX(-100%)':pct<30?'translateX(0)':'translateX(-50%)';
  w.classList.add('on');
}
function hideTips(except){$$('.lcw.on').forEach(w=>{if(w===except)return;w.classList.remove('on');$('.tip',w).hidden=true;$$('.hv,.hd',w).forEach(e=>e.setAttribute('visibility','hidden'))})}
document.addEventListener('pointermove',e=>{const w=e.target.closest('.lcw');hideTips(w);if(w)showTip(w,e.clientX)});
document.addEventListener('pointerdown',e=>{const w=e.target.closest('.lcw');hideTips(w);if(w)showTip(w,e.clientX)});

function invAte(y,m){const lim=`${y}-${pad(m)}-31`;return r2(S.inv.filter(i=>i.data<=lim).reduce((a,i)=>a+invSinal(i),0))}
function chartInv(){
  const J=janelaMeses();const v=J.map(x=>invAte(x.y,x.m));const dlt=r2(v[v.length-1]-(invAte(J[0].m===1?J[0].y-1:J[0].y,J[0].m===1?12:J[0].m-1)));

function barChart(P){
  const W=720,H=230,L=46,B=26,T=10;const max=Math.max(100,...P.meses.map(x=>Math.max(x.r,x.d)));
  const nice=Math.ceil(max/100)*100;const gw=(W-L-8)/12,bw=Math.min(20,gw/2-4);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês">`;
  for(let k=0;k<=4;k++){const y=T+(H-T-B)*(1-k/4);s+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="rgba(31,47,36,.14)"/><text x="${L-8}" y="${y+4}" text-anchor="end">${Math.round(nice*k/4)}</text>`}
  P.meses.forEach((x,i)=>{const cx=L+gw*i+gw/2,h=v=>(H-T-B)*v/nice;
    s+=`<rect x="${cx-bw-1}" y="${H-B-h(x.r)}" width="${bw}" height="${h(x.r)}"  rx="3" fill="#4E7A2A"><title>${MES[i]}: receitas ${brl(x.r)}</title></rect><rect x="${cx+1}" y="${H-B-h(x.d)}" width="${bw}" height="${h(x.d)}"  rx="3" fill="#A63D26"><title>${MES[i]}: despesas ${brl(x.d)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle" ${HOJE.slice(0,7)===ui.ano+'-'+pad(i+1)?'style="font-weight:700;fill:#1F2F24"':''}>${M3[i]}</text>`});
  return s+'</svg>';
}

const BCB=n=>`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${n}/dados/ultimos/1?formato=json`;
const getJ=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
async function carregarMercado(force){
  if(mk.carregando)return;
  if(!force&&mk.dados&&Date.now()-mk.em<3600000)return;
  mk.carregando=true;mk.erro=false;mercadoAtualizar();
  const [selic,cdi,ipca,fx]=await Promise.allSettled([getJ(BCB(432)),getJ(BCB(4389)),getJ(BCB(13522)),getJ('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL')]);
  const d={...(mk.dados||{})};let ok=0;
  const bcb=(r,k)=>{if(r.status==='fulfilled'&&r.value&&r.value[0]){d[k]={v:parseFloat(r.value[0].valor),data:r.value[0].data};ok++}};
  bcb(selic,'selic');bcb(cdi,'cdi');bcb(ipca,'ipca');
  if(fx.status==='fulfilled'&&fx.value){const m={USDBRL:'usd',EURBRL:'eur',BTCBRL:'btc'};Object.entries(m).forEach(([a,k])=>{const x=fx.value[a];if(x){d[k]={v:parseFloat(x.bid),var:parseFloat(x.pctChange)};ok++}})}
  mk.carregando=false;mk.erro=ok<6;
  if(ok>0){mk.dados=d;mk.em=Date.now();try{localStorage.setItem(MK_KEY,JSON.stringify({dados:d,em:mk.em}))}catch(e){}}
  mercadoAtualizar();
}

function rendimentos(){
  const d=mk.dados||{};const taxa=k=>d[k]?d[k].v/100:null;const hoje=new Date(HOJE+'T00:00:00').getTime();const g={};
  [...S.inv].sort((a,b)=>a.data.localeCompare(b.data)).forEach(i=>{const x=g[i.nome]=g[i.nome]||{nome:i.nome,liq:0,est:0,idx:null,pct:100,ok:true};
    const sg=i.operacao==='aporte'?1:-1;x.liq+=sg*i.valor;if(i.idx&&!x.idx){x.idx=i.idx;x.pct=i.pct||100}});
  Object.values(g).forEach(x=>{S.inv.filter(i=>i.nome===x.nome).forEach(i=>{const sg=i.operacao==='aporte'?1:-1;let f=1;
    if(x.idx){const t=taxa(x.idx);if(t==null)x.ok=false;else{const dias=Math.max(0,(hoje-new Date(i.data+'T00:00:00').getTime())/86400000);f=Math.pow(1+t*x.pct/100,dias/365)}}

const serial=s=>Math.round((Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))-Date.UTC(1899,11,30))/86400000);
const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  let cds=0;const cdc=[];

const cs=(v,s)=>({t:'s',v,s:s||0}), cn=(v,s)=>({t:'n',v,s:s==null?ST.M:s}), cf=(f,v,s)=>({t:'f',f,v,s:s==null?ST.M:s}), cd_=(iso_,s)=>({t:'n',v:serial(iso_),s:ST.D});

  sh.rows.forEach((row,ri)=>{if(!row)return;x+=`<row r="${ri+1}">`;row.forEach((c,ci)=>{if(!c)return;const ref=colL(ci)+(ri+1);
    if(c.t==='s')x+=`<c r="${ref}" s="${c.s}" t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`;

function montarPlanilhas(){
  const NL="'Lançamentos'",NI="'Investimentos'";
  const movs=[...S.mov].sort((a,b)=>a.data.localeCompare(b.data)||a.descricao.localeCompare(b.descricao));
  const L=[[cs('Data',ST.H),cs('Descrição',ST.H),cs('Tipo',ST.H),cs('Categoria',ST.H),cs('Valor (R$)',ST.H),cs('Pagamento',ST.H),cs('Parcela',ST.H)]];
  movs.forEach(m=>L.push([cd_(m.data),cs(m.descricao),cs(m.tipo==='receita'?'Receita':'Despesa'),cs(m.categoria),cn(m.valor),cs(m.cartaoId?cartaoNome(m.cartaoId):'À vista'),cs(m.parcela?`${m.parcela.n}/${m.parcela.total}`:'')]));
  const iv=[...S.inv].sort((a,b)=>a.data.localeCompare(b.data));
  const I=[[cs('Data',ST.H),cs('Investimento',ST.H),cs('Categoria',ST.H),cs('Operação',ST.H),cs('Valor (R$)',ST.H),null,cs('Resumo',ST.H),cs('R$',ST.H)]];
  iv.forEach(i=>I.push([cd_(i.data),cs(i.nome),cs(i.categoria),cs(i.operacao==='aporte'?'Aporte':'Resgate'),cn(i.valor)]));
  const tI=invTotal();
  I[1]=I[1]||[];while(I[1].length<6)I[1].push(null);
  I[1][6]=cs('Total investido',ST.B);I[1][7]=cf(`SUMIFS($E:$E,$D:$D,"Aporte")-SUMIFS($E:$E,$D:$D,"Resgate")`,tI,ST.MB);
  const ano=ui.ano,P=agregarAno(ano);
  const rng=m=>[serial(`${ano}-${pad(m)}-01`),serial(m===12?`${ano+1}-01-01`:`${ano}-${pad(m+1)}-01`)];
  const crit=(sh,col,m)=>{const [a,b]=rng(m);return `${sh}!$A:$A,">=${a}",${sh}!$A:$A,"<${b}"`};
  const rows=[];rows[0]=[cs(`Planilha ${ano}`,ST.B)];rows[1]=[cs('Fórmulas ligadas às abas Lançamentos e Investimentos: edite lá e os valores daqui se atualizam.',ST.N)];
  const hdr=[cs('',ST.H),...M3.map(m=>cs(m,ST.H)),cs('Total',ST.H)];rows[3]=hdr;
  let r=5;const R_ANT=r;rows[R_ANT-1]=[cs('Saldo anterior',ST.N)];
  r++;rows[r-1]=[cs('Receitas',ST.SEC),...Array(13).fill(cs('',ST.SEC))];
  const catRows=(tipo,list,key)=>{const first=r+1;list.forEach(c=>{r++;const row=[cs(c)];for(let m=1;m<=12;m++){const v=P.meses[m-1].c[key+'|'+c]||0;row.push(cf(`SUMIFS(${NL}!$E:$E,${NL}!$C:$C,"${tipo}",${NL}!$D:$D,$A${r},${crit(NL,'A',m)})`,r2(v)))}
      row.push(cf(`SUM(B${r}:M${r})`,r2(P.meses.reduce((a,x)=>a+(x.c[key+'|'+c]||0),0)),ST.MB));rows[r-1]=row});return[first,r]};
  const [r1,r2_]=catRows('Receita',CATS.receita,'r');
  r++;const R_TR=r;rows[r-1]=[cs('Total de receitas',ST.B),...P.meses.map((x,i)=>cf(`SUM(${colL(i+1)}${r1}:${colL(i+1)}${r2_})`,r2(x.r),ST.MB)),cf(`SUM(B${r}:M${r})`,r2(P.meses.reduce((a,x)=>a+x.r,0)),ST.MB)];
  r++;rows[r-1]=[cs('Despesas',ST.SEC),...Array(13).fill(cs('',ST.SEC))];
  const [d1,d2]=catRows('Despesa',CATS.despesa,'d');
  r++;const R_TD=r;rows[r-1]=[cs('Total de despesas',ST.B),...P.meses.map((x,i)=>cf(`SUM(${colL(i+1)}${d1}:${colL(i+1)}${d2})`,r2(x.d),ST.MB)),cf(`SUM(B${r}:M${r})`,r2(P.meses.reduce((a,x)=>a+x.d,0)),ST.MB)];
  r++;const R_SB=r;rows[r-1]=[cs('Sobra do mês',ST.ST),...P.meses.map((x,i)=>cf(`${colL(i+1)}${R_TR}-${colL(i+1)}${R_TD}`,x.sobra,ST.SM)),cf(`SUM(B${r}:M${r})`,r2(P.meses.reduce((a,x)=>a+x.sobra,0)),ST.SM)];
  r++;const R_FIM=r;rows[r-1]=[cs('Saldo no fim do mês',ST.B),...P.meses.map((x,i)=>cf(`${colL(i+1)}${R_ANT}+${colL(i+1)}${R_SB}`,x.fim,ST.MB)),cf(`M${r}`,P.meses[11].fim,ST.MB)];
  rows[R_ANT-1]=[cs('Saldo anterior',ST.N),cn(P.prior),...P.meses.slice(1).map((x,i)=>cf(`${colL(i+1)}${R_FIM}`,x.ant))];
  r++;rows[r-1]=[cs('Investimento',ST.SEC),...Array(13).fill(cs('',ST.SEC))];
  r++;rows[r-1]=[cs('Investido no mês (aportes − resgates)',ST.B),...P.meses.map((x,i)=>{const c=crit(NI,'A',i+1);return cf(`SUMIFS(${NI}!$E:$E,${NI}!$D:$D,"Aporte",${c})-SUMIFS(${NI}!$E:$E,${NI}!$D:$D,"Resgate",${c})`,r2(x.inv))}),cf(`SUM(B${r}:M${r})`,r2(P.meses.reduce((a,x)=>a+x.inv,0)),ST.MB)];
  const C=[[cs('Cartão',ST.H),cs('Limite (R$)',ST.H),cs('Dia do fechamento',ST.H),cs('Dia do vencimento',ST.H),cs('Fatura aberta (R$)',ST.H),cs('Disponível (R$)',ST.H),cs('% do limite',ST.H)]];
  S.cartoes.forEach((c,i)=>{const k=calcularCiclo(c),n=i+2;C.push([cs(c.nome),cn(c.limite),cn(c.fechamentoDia,0),cn(c.vencimentoDia,0),cn(k.fatura),cf(`B${n}-E${n}`,k.disponivel),cf(`E${n}/B${n}`,r2(k.fatura/c.limite),0)])});
  return[
    {name:'Lançamentos',rows:L,widths:[12,34,10,16,13,16,9],freeze:[0,1],first:true},
    {name:`Planilha ${ano}`,rows,widths:[38,...Array(12).fill(11),13],freeze:[1,4]},
    {name:'Cartões',rows:C,widths:[18,14,18,18,18,16,12]},
    {name:'Investimentos',rows:I,widths:[12,24,22,12,13,3,18,14],freeze:[0,1]}];
}

  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${sh.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`;

}
function baixar(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function linhasTabela(sep){const mv=[...S.mov].sort((a,b)=>a.data.localeCompare(b.data));
  const q=s=>sep===';'?`"${String(s).replace(/"/g,'""')}"`:String(s).replace(/[\t\n\r]/g,' ');
  return [['Data','Descrição','Tipo','Categoria','Valor (R$)','Pagamento','Parcela'].join(sep),...mv.map(m=>[fd(m.data),q(m.descricao),m.tipo==='receita'?'Receita':'Despesa',m.categoria,num2(m.valor).replace(/\./g,''),m.cartaoId?cartaoNome(m.cartaoId):'À vista',m.parcela?`${m.parcela.n}/${m.parcela.total}`:''].join(sep))].join('\r\n')}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(!e.target.closest('.actions'))closeMenu();
  if(e.target.id==='modal'){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'novo':if(ui.page==='lancamentos'&&innerWidth>=1024){const i=$('#formSlot input[name=descricao]');i&&(i.focus(),i.scrollIntoView({block:'center'}))}else{openModal(`<h2 id="mttl">Nova movimentação<button class="x" data-act="fechar" aria-label="Fechar">${ic('x')}</button></h2>${formMov()}`)}break;
    case 'fechar':closeModal();break;
    case 'del':delMov(id);break;
    case 'del-one':remover([id]);break;
    case 'del-all':{const m=S.mov.find(x=>x.id===id);remover(S.mov.filter(x=>x.parcela&&m.parcela&&x.parcela.grupo===m.parcela.grupo).map(x=>x.id));break}
    case 'undo':undo();break;
    case 'limpar':ui.F={tipo:'todas',cat:'',pag:'',mes:''};$('#listaSlot').innerHTML=listaHTML();break;
    case 'mes-prev':case 'mes-next':{let [y,m]=ui.mes.split('-').map(Number);m+=a==='mes-next'?1:-1;if(m<1){m=12;y--}if(m>12){m=1;y++}ui.mes=`${y}-${pad(m)}`;render();break}
    case 'ano-prev':ui.ano--;render();break;
    case 'ano-next':ui.ano++;render();break;
    case 'menu-export':{const m=$('#menuExp');m.hidden=!m.hidden;b.setAttribute('aria-expanded',String(!m.hidden));break}
    case 'export-xlsx':closeMenu();baixar(xlsxBlob(),`FinanceFlow_${ui.ano}.xlsx`);toast('Planilha .xlsx baixada');break;
    case 'export-csv':closeMenu();baixar(new Blob(['﻿'+linhasTabela(';')],{type:'text/csv;charset=utf-8'}),'FinanceFlow_lancamentos.csv');toast('CSV baixado');break;
    case 'export-copy':closeMenu();(navigator.clipboard?navigator.clipboard.writeText(linhasTabela('\t')):Promise.reject()).then(()=>toast('Copiado. Cole na planilha.')).catch(()=>toast('Não foi possível copiar. Use o CSV.'));break;
    case 'tema':{const d=document.documentElement;const n=d.dataset.tema==='dark'?'light':'dark';d.dataset.tema=n;try{localStorage.setItem('financeflow:tema',n)}catch(e){}render();break}
    case 'janela':ui.janela=+b.dataset.v;render();break;
    case 'mercado':carregarMercado(true);break;
    case 'cartao-novo':openModal(`<h2 id="mttl">Novo cartão<button class="x" data-act="fechar" aria-label="Fechar">${ic('x')}</button></h2>${formCartao()}`);break;
    case 'cartao-del':{const c=S.cartoes.find(x=>x.id===id);if(c)openModal(`<h2 id="mttl">Remover cartão<button class="x" data-act="fechar" aria-label="Fechar">${ic('x')}</button></h2><p class="muted">Remover o cartão ${esc(c.nome)}? As compras continuam na lista, sem cartão.</p><div class="choices"><button class="btn primary" data-act="cartao-del-ok" data-id="${id}">Remover</button><button class="btn" data-act="fechar">Cancelar</button></div>`);break}
    case 'cartao-del-ok':S.cartoes=S.cartoes.filter(x=>x.id!==id);S.mov.forEach(m=>{if(m.cartaoId===id)m.cartaoId=null});save();closeModal();render();toast('Cartão removido');break;
    case 'inv-del':{const i=S.inv.find(x=>x.id===id);S.inv=S.inv.filter(x=>x.id!==id);removido={tipo:'inv',itens:[i]};save();render();toast('Registro excluído',true);break}
    case 'reset':openModal(`<h2 id="mttl">Restaurar exemplo<button class="x" data-act="fechar" aria-label="Fechar">${ic('x')}</button></h2><p class="muted">Voltar para os dados de exemplo? Isso apaga o que você cadastrou.</p><div class="choices"><button class="btn primary" data-act="reset-ok">Restaurar</button><button class="btn" data-act="fechar">Cancelar</button></div>`);break;
    case 'reset-ok':S=seed();save();ui.F={tipo:'todas',cat:'',pag:'',mes:''};closeModal();render();toast('Dados de exemplo restaurados');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){ui.F[t.dataset.f]=t.value;$('#listaSlot').innerHTML=listaHTML();return}
  if(t.hasAttribute('data-fc')){ui.cartaoSel=t.value;render();return}
  const form=t.closest('.mov-form');
  if(form){if(t.name==='tipo'){form.dataset.tipo=t.value;form.elements.categoria.innerHTML=CATS[t.value].map(c=>`<option>${c}</option>`).join('')}
    if(t.name==='cartao'){t.value?form.setAttribute('data-cartao',''):(form.removeAttribute('data-cartao'),form.elements.parcelas.value='1')}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.classList.contains('mov-form'))submitMov(f);
  else if(f.classList.contains('cartao-form')){const nome=f.nome.value.trim(),lim=parseValor(f.limite.value),fe=+f.fech.value,ve=+f.venc.value;
    erro(f,'nome',nome?'':'Informe o nome do cartão.');erro(f,'limite',lim>0?'':'Informe um limite maior que zero.');erro(f,'fech',fe>=1&&fe<=31?'':'Dia de 1 a 31.');erro(f,'venc',ve>=1&&ve<=31?'':'Dia de 1 a 31.');
    if(!nome||!(lim>0)||!(fe>=1&&fe<=31)||!(ve>=1&&ve<=31))return;
    S.cartoes.push({id:'c-'+uid(),nome,limite:r2(lim),fechamentoDia:fe,vencimentoDia:ve,cor:f.cor.value});save();closeModal();render();toast('Cartão salvo')}
  else if(f.classList.contains('inv-form')){const nome=f.nome.value.trim(),v=parseValor(f.valor.value),op=f.operacao.value,data=f.data.value;
    erro(f,'nome',nome?'':'Informe o investimento.');erro(f,'valor',v>0?'':'Informe um valor maior que zero.');erro(f,'data',data?'':'Escolha uma data.');
    if(!nome||!(v>0)||!data)return;
    if(op==='resgate'){const tem=S.inv.filter(i=>i.nome.toLowerCase()===nome.toLowerCase()).reduce((a,i)=>a+invSinal(i),0);if(v>tem+.005){erro(f,'valor',`Você tem só ${brl(Math.max(0,tem))} em ${nome}.`);return}}
    const pcx=parseValor(f.pct.value);S.inv.push({id:uid(),nome,categoria:f.categoria.value,operacao:op,valor:r2(v),data,idx:f.idx.value||null,pct:pcx>0?pcx:100});save();render();toast(op==='aporte'?'Aporte registrado':'Resgate registrado')}
  else if(f.classList.contains('meta-form')){const v=parseValor(f.valor.value);if(!(v>0))return;S.meta={categoria:f.categoria.value,valor:r2(v)};save();render();toast('Meta atualizada')}
});

addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TIT[h]&&h!==ui.page){ui.page=h;render()}});
